<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMET | 訂單查詢系統</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1e293b; /* 配合妳後台的深藍色 */
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p { opacity: 0.8; font-size: 0.9rem; }
  </style>
  
  <script>
    // ⬇️ 請將下方的引號內容替換成妳 GAS 的「正式部署網址」
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwEyNEMfdbHflnI4eT3SO6B4-w7474FNGPHYOLCSetavKvXOeMS5ELHQD-EWr6-y32HYQ/exec";

    window.onload = function() {
      // 延遲 0.5 秒跳轉，讓使用者看到系統名稱，增加品牌感
      setTimeout(() => {
        window.location.href = GAS_URL;
      }, 500);
    };
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">COMET</div>
    <div class="loader"></div>
    <p>正在安全連線至訂單系統...</p>
  </div>
</body>
</html>
